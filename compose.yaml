services:
  # ─── Application ────────────────────────────────────────────────────────────
  app:
    build: .
    container_name: vetautet-app
    ports:
      - "8080:8081"
    environment:
      - APP_DB_URL=jdbc:postgresql://postgres:5432/vetautet_db
      - APP_DB_USERNAME=tigerpro
      - APP_DB_PASSWORD=secret
      - APP_REDIS_HOST=redis
      - APP_REDIS_PORT=6379
      - APP_REDIS_PASSWORD=
      - APP_AUTH_FRONTEND_BASE_URL=http://localhost:3000
      - APP_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - APP_KAFKA_OUTBOX_TOPIC=vetautet.outbox.events
      - APP_KAFKA_PRODUCER_BATCH_SIZE=32768
      - APP_KAFKA_PRODUCER_LINGER_MS=20
    volumes:
      - app-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - vetautet-network
    restart: unless-stopped

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: "postgres:17-alpine"
    container_name: vetautet-postgres
    environment:
      - "POSTGRES_DB=vetautet_db"
      - "POSTGRES_PASSWORD=secret"
      - "POSTGRES_USER=tigerpro"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tigerpro -d vetautet_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vetautet-network
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter
    container_name: vetautet-postgres-exporter
    ports:
      - "9187:9187"
    environment:
      - DATA_SOURCE_NAME=postgresql://tigerpro:secret@postgres:5432/vetautet_db?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vetautet-network
    restart: unless-stopped

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: vetautet-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vetautet-network
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter
    container_name: vetautet-redis-exporter
    command: -redis.addr redis://redis:6379
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - vetautet-network
    restart: unless-stopped

  # ─── MinIO ──────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: vetautet-minio
    command: server /data --console-address ':9001'
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web Console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - vetautet-network
    restart: unless-stopped

  # ─── Kafka (KRaft mode, no Zookeeper) ───────────────────────────────────────
  kafka:
    image: apache/kafka:4.3.0
    container_name: vetautet-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9094:9094" # Truy cập từ host qua localhost:9094
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - vetautet-network
    restart: unless-stopped

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: vetautet-kafka-exporter
    command:
      - "--kafka.server=kafka:9092"
      - "--kafka.version=4.0.0"
      - "--topic.filter=.*"
      - "--group.filter=.*"
      - "--web.listen-address=:9308"
      - "--log.level=info"
    ports:
      - "9308:9308"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - vetautet-network
    restart: unless-stopped

  # ─── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: vetautet-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    depends_on:
      - app
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - vetautet-network
    restart: unless-stopped

  # ─── Grafana ──────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana
    container_name: vetautet-grafana
    hostname: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SING_UP=false
      - GF_SERVER_DOMAIN=localhost
      - GF_LOG_MODE=console file
      - GF_LOG_FILTERS=alerting.notifier.slack:debug alermanager:debug ngalert:debug
    volumes:
      - ./grafana-storage:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    networks:
      - vetautet-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: vetautet-node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    ports:
      - "9100:9100"
    networks:
      - vetautet-network

  # ─── Alertmanager ──────────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.25.0
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - alertmanager_config:/etc/alertmanager
      - alertmanager_data:/alertmanager
    networks:
      - vetautet-network

  # ─── Elasticsearch ──────────────────────────────────────────────────────────
  elasticsearch:
    image: elasticsearch:8.17.4
    container_name: vetautet-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=vetautet-cluster
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -sf http://localhost:9200/_cluster/health | grep -q "\"status\":\"green\"\|\"status\":\"yellow\""',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - vetautet-network
    restart: unless-stopped

  # ─── Logstash ───────────────────────────────────────────────────────────────
  logstash:
    image: logstash:8.17.4
    container_name: vetautet-logstash
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    volumes:
      - ./docker/logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ./docker/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - app-logs:/logs:ro
      - logstash-data:/usr/share/logstash/data
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - vetautet-network
    restart: unless-stopped

  # ─── Kibana ─────────────────────────────────────────────────────────────────
  kibana:
    image: kibana:8.17.4
    container_name: vetautet-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - KIBANA_SYSTEM_PASSWORD=
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - vetautet-network
    restart: unless-stopped

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres-data:
  redis-data:
  minio-data:
  kafka-data:
  prometheus-data:
  elasticsearch-data:
  logstash-data:
  app-logs:
  alertmanager_config:
  alertmanager_data:

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  vetautet-network:
    driver: bridge
