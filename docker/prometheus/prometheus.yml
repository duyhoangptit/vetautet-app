global:
  scrape_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Load rules once and periodically evaluate them according to the global 'evaluation_interval'.
rule_files:
  - rules/node_exporter.yml
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: "vetautet-app"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["vetautet-app:8080"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "vetautet-app"

  - job_name: "report-job"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["report-job-app:8080"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "report-job"

  - job_name: "postgres-exporter"
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: "postgres"

  - job_name: "redis-exporter"
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: "redis"

  - job_name: "kafka-exporter"
    static_configs:
      - targets: ["kafka-exporter:9308"]
        labels:
          service: "kafka"

  - job_name: "prometheus"
    scrape_interval: 5s
    static_configs:
      - targets: ["localhost:9090"]
    metrics_path: "/metrics"

  - job_name: "node-exporter"
    scrape_interval: 5s
    static_configs:
      - targets: ["node-exporter:9100"]
    relabel_configs:
      - source_labels: [ __address__ ]
        separator: ':'
        regex: '(.*):(.*)'
        replacement: '${1}'
        target_label: instance
